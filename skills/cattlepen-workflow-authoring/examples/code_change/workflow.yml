schema_version: 2
id: REPLACE_WITH_ENTRY_ID
name: code_change
settings:
  max_agent_retries: 1
agents:
  planner: {version: 1}
  developer: {version: 1}
  reviewer: {version: 1}
deliverables:
  task: {version: 1}
  impl_plan: {version: 1}
  change: {version: 1}
  test_report: {version: 1}
  review_report: {version: 1}
  owner_answer: {version: 1}
  pr_ref: {version: 1}
inputs: [task]
outputs: [pr_ref]
entry: plan
nodes:
  plan:
    type: agent
    label: Plan the change
    agent: planner
    runtime: {harness: claude-code, model: claude-opus-5-5, effort: xhigh}
    consumes:
      task: $input
    produces: [impl_plan]
    next: develop
  develop:
    type: agent
    label: Implement
    agent: developer
    runtime: {harness: claude-code, model: claude-sonnet-5-5, effort: high}
    consumes:
      task: $input
      impl_plan: plan
    produces: [change]
    next: verify
  verify:
    type: inline
    label: Lint and test
    run:
      script: |
        set -u
        log="$(mktemp)"
        if [ ! -f ./scripts/check.sh ]; then
          echo "this repository has no scripts/check.sh; adapt the verify node" > "$log"
          result=fail
        elif sh ./scripts/check.sh >"$log" 2>&1; then
          result=pass
        else
          result=fail
        fi
        tail -c 6000 "$log" | jq -Rs --arg r "$result" '{result: $r, summary: .}' > "$SHEPHERD_OUT/test_report.json"
    produces: [test_report]
    next: check
  check:
    type: switch
    label: Checks pass?
    consumes:
      test_report: verify
    on: result
    routes:
      pass: review
      fail: fix
  review:
    type: agent
    label: Review the change
    agent: reviewer
    runtime: {harness: claude-code, model: claude-opus-5-5, effort: xhigh}
    consumes:
      task: $input
      impl_plan: plan
      change: develop
      test_report: verify
    produces: [review_report]
    next: verdict
  verdict:
    type: switch
    label: Ship?
    consumes:
      review_report: review
    on: verdict
    routes:
      ship: publish
      rework: fix
  publish:
    type: inline
    label: Commit, push and open the pull request
    run:
      script: |
        set -eu
        title="$(printf '%s' "$SHEPHERD__TASK" | jq -r .title)"
        run_id="$(jq -r .run_id "$SHEPHERD_IN/_shepherd/run.json")"
        branch="cattlepen/${run_id}"
        listed="$(mktemp)"
        printf '%s' "$SHEPHERD__CHANGE" | jq -r '.files // [] | .[]' > "$listed"
        git add -u
        while IFS= read -r path; do
          if [ -f "$path" ] && ! git check-ignore -q -- "$path"; then
            git add -- "$path"
          fi
        done < "$listed"
        if ! git diff --cached --quiet; then
          git -c commit.gpgsign=false commit -q -m "$title"
        fi
        git push -q origin "HEAD:refs/heads/${branch}"
        url="$(gh pr list --head "$branch" --json url --jq '.[0].url // ""')"
        if [ -z "$url" ]; then
          url="$(gh pr create --head "$branch" --title "$title" --body-file "$SHEPHERD_IN/impl_plan.md")"
        fi
        jq -n --arg url "$url" --arg branch "$branch" '{url: $url, branch: $branch}' > "$SHEPHERD_OUT/pr_ref.json"
    consumes:
      task: $input
      impl_plan: plan
      change: develop
    produces: [pr_ref]
    next: done
  stuck:
    type: human_gate
    label: Rework budget spent
    prompt: "The change still fails its checks or its review after three reworks. The last test report and the change summary are among the run's results (nodes verify and develop). Approve to commit the change and open the pull request anyway; reject to stop the run without a pull request."
    consumes:
      change: develop
      test_report: verify
    produces: [owner_answer]
    timeout_s: null
    next: override
  override:
    type: switch
    label: Open the pull request anyway?
    consumes:
      owner_answer: stuck
    on: decision
    routes:
      approve: publish
      reject: give_up
  done:
    type: end
  give_up:
    type: cancel
    label: Stopped by the owner
reworks:
  fix:
    resume_from: develop
    feedback: {node: verify, deliverable: test_report}
    max_reworks: 3
    on_exhausted: stuck
